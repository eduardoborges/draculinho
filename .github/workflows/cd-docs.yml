name: CD - Docs

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (optional, default: main)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: "docs"
      url: "https://draculinho.eduardoborges.dev"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || 'main' }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # docs/ is a static page, no build step
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.152.0 pages deploy docs --project-name=draculinho
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
