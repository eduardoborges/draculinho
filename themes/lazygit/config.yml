# Draculinho for lazygit. Merge under gui: in ~/Library/Application Support/lazygit/config.yml
gui:
  theme:
    activeBorderColor: ["#BD93F9", bold]
    inactiveBorderColor: ["#465276"]
    searchingActiveBorderColor: ["#FFB86C", bold]
    optionsTextColor: ["#00B5DC"]
    selectedLineBgColor: ["#282A36"]
    inactiveViewSelectedLineBgColor: ["#21222C"]
    cherryPickedCommitFgColor: ["#00B5DC"]
    cherryPickedCommitBgColor: ["#BD93F9"]
    markedBaseCommitFgColor: ["#00B5DC"]
    markedBaseCommitBgColor: ["#E2DD61"]
    unstagedChangesColor: ["#FF5555"]
    defaultFgColor: ["#CDD0DD"]
